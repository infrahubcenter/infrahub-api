# Standalone production deployment of JUST the backend, against an
# externally managed Postgres (RDS, Cloud SQL, a shared DB host, ...) --
# for deploying infrahub-api independently of infrahub-ui/Postgres, e.g.
# onto its own compute. To run the whole stack (Postgres + backend +
# frontend) together in one place instead, see docker-compose.prod.yml at
# the repo root.
#
#   docker compose up -d --build
#   docker compose exec infrahub-api ./migrate up
#
# Configuration, any of (see config.example.ini):
#   - a .env file next to this compose file (copy .env.example), or
#   - ./config/production.ini.enc (infrahub-config encrypt --stage production)
#     plus SECRET exported in the shell/CI secret store that runs
#     this command -- never committed or baked into the image.
# DATABASE_URL must point at your real Postgres endpoint.
services:
  infrahub-api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      STAGE: ${STAGE:-}
      SECRET: ${SECRET:-}
    volumes:
      - ./config:/app/config:ro
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
