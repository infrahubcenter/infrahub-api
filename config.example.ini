# Infra Hub Center API -- example configuration (demo values only).
#
# Configuration can come from any of these, highest priority first; use
# whichever suits your deployment, or mix them:
#
#   1. Real environment variables -- docker run -e, Compose `environment:`,
#      a Kubernetes Secret/ConfigMap, a systemd unit, your shell.
#   2. A .env file -- .env next to the API (or INFRAHUB_ENV_FILE=/path/.env),
#      same KEY=VALUE lines as this file.
#   3. An encrypted file per stage -- <stage>.ini.enc, e.g. production.ini.enc.
#      The whole file is encrypted into one line, so nothing in it is readable.
#
# Each stage has a plain file you edit (real values, git-ignored, stays on
# your machine) and the encrypted file the API reads:
#
#   development.ini  --./config.sh encrypt development-->  development.ini.enc
#   development.ini  <--./config.sh decrypt development--  development.ini.enc
#
# First time:
#   cp config.example.ini development.ini           # put in your real values
#   gen-encryption-key > .master.key                # development; other stages use SECRET
#   ./config.sh encrypt development                 # -> development.ini.enc
#
# Same for staging.ini / production.ini (./config.sh encrypt production).
# ./config.sh is a local helper (not in the repo); without it use the tool in
# the API image, e.g. for production:
#   docker run --rm -i -e SECRET --entrypoint /app/infrahub-config \
#     docker.io/infrahubcenter/infrahub-api:1.0.0 \
#     encrypt --stage production --in - --out - < production.ini > production.ini.enc
#
# To run with it, the API needs BOTH:
#   STAGE=production                         # the stage: development | staging | production
#   SECRET=<the key>                   # the secret (or SECRET_FILE=/run/secrets/key)
#
# Never commit <stage>.ini, .env or the master key (all git-ignored). Every value below is a
# placeholder -- generate your own secrets.

[app]
APP_PORT = 8080
# The address browsers and agents use to reach this platform (its domain or
# IP, never localhost). Also the default for FRONTEND_ORIGIN, APP_BASE_URL,
# OAUTH_REDIRECT_BASE_URL and the agents' backend URLs.
PUBLIC_URL = https://infrahub.example.com
# Comma-separated, only when the console is served from other origins too:
# FRONTEND_ORIGIN = https://infrahub.example.com,https://console.example.com
COOKIE_SECURE = true

[database]
# PostgreSQL 14+ -- the built-in container, or a managed database (RDS,
# Cloud SQL, Azure, Neon...). URL-encode special characters in the password.
DATABASE_URL = postgres://infrahub:demo-db-password@postgres.example.internal:5432/infrahub?sslmode=require
DB_MAX_CONNS = 10
DB_MIN_CONNS = 2

[security]
# openssl rand -hex 48
JWT_SECRET = demo-jwt-secret-replace-with-openssl-rand-hex-48-0123456789abcdef
# 32 random bytes, base64: openssl rand -base64 32 (encrypts saved SSH keys --
# changing it later makes stored SSH keys unreadable)
SSH_CREDENTIAL_ENCRYPTION_KEY = ZGVtby1zc2gta2V5LXJlcGxhY2UtbWUtMzItYnl0ZXM=
ACCESS_TOKEN_TTL_MINUTES = 15
REFRESH_TOKEN_TTL_DAYS = 7
LOGIN_RATE_LIMIT_ATTEMPTS = 10
# Only when a trusted proxy in front of the API (e.g. a hosted console) must
# present this key on every request: openssl rand -hex 32
# INFRAHUB_PROXY_KEY =

[first-admin]
# Created once, on first start. Password: 12+ characters.
BOOTSTRAP_ADMIN_EMAIL = admin@example.com
BOOTSTRAP_ADMIN_NAME = Owner
BOOTSTRAP_ADMIN_PASSWORD = Demo-Admin-Passw0rd!

[plan]
# Empty = the free Community plan. Paste a Team/Business/Enterprise key here.
INFRAHUB_LICENSE_KEY =

[email]
# SMTP for alert emails (can also be set in the console under Settings).
SMTP_HOST = smtp.example.com
SMTP_PORT = 587
SMTP_USERNAME = alerts@example.com
SMTP_PASSWORD = demo-smtp-password
SMTP_FROM_EMAIL = alerts@example.com
SMTP_USE_TLS = true

[sign-in]
# Optional "Continue with GitHub / Google". Callback URLs:
#   <PUBLIC_URL>/api/auth/oauth/github/callback and .../google/callback
GITHUB_CLIENT_ID =
GITHUB_CLIENT_SECRET =
GOOGLE_CLIENT_ID =
GOOGLE_CLIENT_SECRET =

[log-archive]
# Where container/pod logs older than the retention window are archived:
# none | volume | s3
LOG_ARCHIVE_BACKEND = s3
LOG_ARCHIVE_VOLUME_PATH = /var/lib/infrahub/log-archive
# Any S3-compatible storage: AWS S3, MinIO, DigitalOcean Spaces, Cloudflare R2...
LOG_ARCHIVE_S3_BUCKET = infrahub-log-archive-demo
LOG_ARCHIVE_S3_REGION = us-east-1
# Leave empty for AWS; set for MinIO/Spaces/R2, e.g. https://minio.example.internal:9000
LOG_ARCHIVE_S3_ENDPOINT =
LOG_ARCHIVE_S3_PREFIX = infrahub/logs
LOG_ARCHIVE_S3_ACCESS_KEY_ID = AKIADEMOEXAMPLE00001
LOG_ARCHIVE_S3_SECRET_ACCESS_KEY = demo-s3-secret-access-key-replace-me

[retention]
# Capped by your plan (Community: 3 days).
VM_MONITOR_RETENTION_DAYS = 30
DOCKER_METRICS_RETENTION_DAYS = 7
DATABASE_METRICS_RETENTION_DAYS = 7
OBJECT_STORAGE_METRICS_RETENTION_DAYS = 30
DOCKER_LOG_RETENTION_DAYS = 30
K8S_LOG_RETENTION_DAYS = 30

# Every other tuning setting (intervals, workers, thresholds) has a sensible
# default -- see .env.example for the full list.
